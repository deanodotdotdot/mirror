syntax = "proto3";

// buf:lint:ignore DIRECTORY_SAME_PACKAGE
package mirror.agent.v1;

import "mirror/protocol/agent.proto";
import "mirror/protocol/mirror.proto";

message WorkspacePreferences {
  // Moved into `definition` under the same numbers; the CLI migrates
  // preferences saved with them.
  reserved 1, 3 to 5, 7, 8;
  reserved "reasoning_effort", "model", "system_prompt";
  reserved "tools_allowlist", "model_api", "model_base_url";

  optional ApprovalMode approval_mode = 2;
  repeated string extensions = 6;
  optional string tag_id = 9;
  mirror.v1.AgentDefinition definition = 10;
}
